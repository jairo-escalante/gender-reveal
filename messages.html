<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Messages for Alexander</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #f7f5ef; color: #334940; font-family: system-ui, sans-serif; }
    main { width: min(760px, 100%); margin: auto; padding: 36px 20px; }
    header { text-align: center; margin-bottom: 24px; }
    header p { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font: normal clamp(28px, 5vw, 42px) Georgia, serif; margin: 12px 0; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    button, select { font: inherit; border: 1px solid #ced6ce; background: #fff; color: #334940; border-radius: 12px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
    button:hover { background: #eaf0e8; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #728b72; outline-offset: 4px; }
    button:disabled { opacity: .4; cursor: default; }
    article { background: white; border: 1px solid #e1e5dc; border-radius: 24px; padding: clamp(24px, 5vw, 44px); box-shadow: 0 8px 30px #33494008; touch-action: pan-y; }
    h2 { font: normal 28px Georgia, serif; margin: 0 0 24px; overflow-wrap: anywhere; }
    blockquote { font: normal clamp(21px, 3.5vw, 29px)/1.6 Georgia, serif; margin: 0 0 32px; white-space: pre-wrap; overflow-wrap: anywhere; }
    dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 0; padding-top: 20px; border-top: 1px solid #e7e9e2; }
    dt { color: #738074; font-size: 12px; margin-bottom: 6px; }
    dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
    nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 20px; }
    nav button { font-size: 26px; width: 56px; }
    #position { font-variant-numeric: tabular-nums; min-width: 72px; text-align: center; }
    #slider { width: 100%; margin: 24px 0 0; accent-color: #637f62; cursor: pointer; }
    .hint { text-align: center; color: #738074; font-size: 13px; }
    #status { text-align: center; padding: 16px; line-height: 1.6; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 24px; text-align: center; }
    .stat { border-radius: 14px; background: #f5f6f1; padding: 18px 8px; }
    .stat strong { display: block; font-size: clamp(24px, 5vw, 36px); font-weight: 500; }
    .stat span { display: block; font-size: 13px; margin-top: 8px; }
    .stat small { display: block; margin-top: 6px; color: #738074; }
    .stat.boy { background: #eaf2f7; } .stat.girl { background: #fbecf0; }
    h3 { font: normal 22px Georgia, serif; margin: 28px 0 12px; }
    #top-dates { padding-left: 24px; margin: 0; }
    #top-dates li { padding: 10px 0 10px 4px; border-bottom: 1px solid #e7e9e2; }
    .date-row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
    .date-row small { color: #738074; white-space: nowrap; }
    @media (max-width: 480px) { main { padding: 24px 16px; } dl { grid-template-columns: 1fr; gap: 12px; } h2 { font-size: 25px; } }
  </style>
</head>
<body>
  <main>
    <header><p>Familia Escalante</p><h1 id="title">Messages for Alexander</h1></header>
    <div class="toolbar">
      <select id="language" aria-label="Language"><option value="en">English</option><option value="es">Español</option></select>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <p id="status" role="status">Loading messages…</p>
    <section id="viewer" hidden aria-label="Messages">
      <article id="card" aria-live="polite" aria-atomic="true">
        <div id="summary">
          <h2 id="summary-title">Your predictions</h2>
          <div class="stats">
            <div class="stat"><strong id="participants">0</strong><span id="participants-label">Participants</span></div>
            <div class="stat boy"><strong id="boy-percent">—</strong><span id="boy-label">Boy</span><small id="boy-count"></small></div>
            <div class="stat girl"><strong id="girl-percent">—</strong><span id="girl-label">Girl</span><small id="girl-count"></small></div>
          </div>
          <h3 id="dates-title">5 most selected dates</h3>
          <ol id="top-dates"></ol>
          <p class="hint" id="stats-note">Based on submitted responses.</p>
        </div>
        <div id="message-slide" hidden>
        <h2 id="name"></h2>
        <blockquote id="message"></blockquote>
        <dl>
          <div><dt id="prediction-label">Prediction</dt><dd id="prediction"></dd></div>
          <div><dt id="guess-label">Name guess</dt><dd id="guess"></dd></div>
          <div><dt id="birth-label">Birth date guess</dt><dd id="birth"></dd></div>
        </dl>
        </div>
      </article>
      <nav aria-label="Message navigation">
        <button id="previous" type="button" aria-label="Previous message">←</button>
        <span id="position" aria-live="polite"></span>
        <button id="next" type="button" aria-label="Next message">→</button>
      </nav>
      <input id="slider" type="range" min="1" max="1" value="1" aria-label="Choose a message">
      <p class="hint" id="hint">Use the arrows, drag the slider, or swipe.</p>
    </section>
  </main>
  <script src="./config.js"></script>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const config = window.REVEAL_CONFIG || {};
    const words = {
      en: { title: 'Messages for Alexander', refresh: 'Refresh', loading: 'Loading messages…', empty: 'No responses yet. Check back soon.', failed: 'Messages could not be loaded. Please try Refresh.', permission: 'The message viewer needs to be enabled in the database.', prediction: 'Prediction', guess: 'Name guess', birth: 'Birth date guess', boy: 'Boy', girl: 'Girl', blank: 'No message was included.', none: 'Not provided', previous: 'Previous message', next: 'Next message', slider: 'Choose a message', hint: 'Use the arrows, drag the slider, or swipe.' },
      es: { title: 'Mensajes para Alexander', refresh: 'Actualizar', loading: 'Cargando mensajes…', empty: 'Todavía no hay respuestas. Vuelve pronto.', failed: 'No pudimos cargar los mensajes. Pulsa Actualizar para intentar de nuevo.', permission: 'Falta habilitar el visor de mensajes en la base de datos.', prediction: 'Predicción', guess: 'Nombre que imaginó', birth: 'Fecha de nacimiento que imaginó', boy: 'Niño', girl: 'Niña', blank: 'No dejó un mensaje.', none: 'Sin respuesta', previous: 'Mensaje anterior', next: 'Mensaje siguiente', slider: 'Elige un mensaje', hint: 'Usa las flechas, mueve la barra o desliza.' }
    };
    Object.assign(words.en, { summary: 'Your predictions', participants: 'Participants', dates: '5 most selected dates', note: 'Based on submitted responses. Tied dates are ordered from earliest to latest.', vote: 'vote', votes: 'votes', previous: 'Previous slide', next: 'Next slide', slider: 'Choose a slide' });
    Object.assign(words.es, { summary: 'Sus predicciones', participants: 'Participantes', dates: 'Las 5 fechas más elegidas', note: 'Según las respuestas enviadas. Las fechas empatadas se ordenan de la más temprana a la más tardía.', vote: 'voto', votes: 'votos', previous: 'Diapositiva anterior', next: 'Diapositiva siguiente', slider: 'Elige una diapositiva' });
    let language = navigator.language.startsWith('es') ? 'es' : 'en';
    let rows = [], index = 0, loading = false, hasLoaded = false, statusKey = 'loading', touch = null;
    const t = key => words[language][key];
    const votes = count => `${count} ${t(count === 1 ? 'vote' : 'votes')}`;
    function formatDate(value) {
      const date = new Date(`${value}T12:00:00`);
      return Number.isNaN(date.getTime()) ? t('none') : date.toLocaleDateString(language, { month: 'long', day: 'numeric', year: 'numeric' });
    }
    function renderSummary() {
      const boys = rows.filter(row => row.prediction === 'boy').length;
      const girls = rows.filter(row => row.prediction === 'girl').length;
      const total = boys + girls;
      const boyPercent = total ? Math.round(boys / total * 1000) / 10 : 0;
      const percent = value => `${value.toLocaleString(language, { maximumFractionDigits: 1 })}%`;
      $('participants').textContent = rows.length.toLocaleString(language);
      $('boy-percent').textContent = total ? percent(boyPercent) : '—';
      $('girl-percent').textContent = total ? percent(Math.round((100 - boyPercent) * 10) / 10) : '—';
      $('boy-count').textContent = votes(boys);
      $('girl-count').textContent = votes(girls);
      const dates = new Map();
      for (const row of rows) if (row.birth_guess) dates.set(row.birth_guess, (dates.get(row.birth_guess) || 0) + 1);
      $('top-dates').replaceChildren();
      const topDates = [...dates].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 5);
      for (const [date, count] of topDates) {
        const item = document.createElement('li');
        const line = document.createElement('div');
        line.className = 'date-row';
        const label = document.createElement('span');
        label.textContent = formatDate(date);
        const countLabel = document.createElement('small');
        countLabel.textContent = votes(count);
        line.append(label, countLabel);
        item.append(line);
        $('top-dates').append(item);
      }
    }

    function render() {
      $('viewer').hidden = !hasLoaded;
      $('status').hidden = statusKey === null;
      $('status').textContent = statusKey ? t(statusKey) : '';
      if (!hasLoaded) return;
      $('summary').hidden = index !== 0;
      $('message-slide').hidden = index === 0;
      const row = rows[index - 1];
      if (index === 0) renderSummary();
      else {
      // Guest content is always rendered as text, never HTML.
      $('name').textContent = row.name;
      $('message').textContent = row.message?.trim() ? row.message : t('blank');
      $('message').lang = row.language === 'es' ? 'es' : 'en';
      $('prediction').textContent = row.prediction === 'boy' ? t('boy') : t('girl');
      $('guess').textContent = row.name_guess?.trim() ? row.name_guess : t('none');
      $('birth').textContent = formatDate(row.birth_guess);
      }
      $('position').textContent = `${index + 1} / ${rows.length + 1}`;
      $('slider').max = String(rows.length + 1);
      $('slider').value = String(index + 1);
      $('slider').setAttribute('aria-valuetext', `${index + 1} / ${rows.length + 1}: ${index === 0 ? t('summary') : row.name}`);
      $('previous').disabled = $('next').disabled = rows.length === 0;
      $('slider').disabled = rows.length === 0;
    }
    function translate() {
      document.documentElement.lang = language;
      document.title = t('title');
      $('language').value = language;
      for (const [id, key] of Object.entries({title:'title',refresh:'refresh','prediction-label':'prediction','guess-label':'guess','birth-label':'birth',hint:'hint','summary-title':'summary','participants-label':'participants','boy-label':'boy','girl-label':'girl','dates-title':'dates','stats-note':'note'})) $(id).textContent = t(key);
      for (const key of ['previous','next','slider']) $(key).setAttribute('aria-label', t(key));
      render();
    }
    function move(delta) {
      if (!rows.length) return;
      index = (index + delta + rows.length + 1) % (rows.length + 1);
      render();
    }
    async function load() {
      if (loading) return;
      loading = true;
      $('refresh').disabled = true;
      statusKey = 'loading';
      render();
      const selected = index === 0 ? null : rows[index - 1]?.id;
      try {
        const all = [];
        // Page through every response, including rows with an optional blank message.
        const pageSize = 500;
        const cutoff = new Date().toISOString();
        for (let offset = 0; ; offset += pageSize) {
          const url = new URL('/rest/v1/predictions', config.SUPABASE_URL);
          url.searchParams.set('select', 'id,created_at,name,message,prediction,name_guess,birth_guess,language');
          url.searchParams.set('order', 'created_at.asc,id.asc');
          url.searchParams.set('created_at', `lte.${cutoff}`);
          url.searchParams.set('offset', String(offset));
          url.searchParams.set('limit', String(pageSize));
          const response = await fetch(url, { headers: { apikey: config.SUPABASE_PUBLISHABLE_KEY }, cache: 'no-store', signal: AbortSignal.timeout(20000) });
          if (!response.ok) {
            const error = new Error('Could not read responses');
            error.permission = [401, 403].includes(response.status);
            throw error;
          }
          const page = await response.json();
          if (!Array.isArray(page)) throw new Error('Unexpected response');
          all.push(...page);
          if (page.length < pageSize) break;
        }
        rows = all;
        hasLoaded = true;
        index = selected ? Math.max(0, rows.findIndex(row => row.id === selected) + 1) : 0;
        statusKey = rows.length ? null : 'empty';
      } catch (error) {
        statusKey = error.permission ? 'permission' : 'failed';
      } finally {
        loading = false;
        $('refresh').disabled = false;
        render();
      }
    }
    $('previous').addEventListener('click', () => move(-1));
    $('next').addEventListener('click', () => move(1));
    $('refresh').addEventListener('click', load);
    $('slider').addEventListener('input', event => { index = Number(event.target.value) - 1; render(); });
    $('language').addEventListener('change', event => { language = event.target.value; translate(); });
    document.addEventListener('keydown', event => {
      if (event.target.closest('input, select, textarea') || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); move(event.key === 'ArrowLeft' ? -1 : 1); }
    });
    $('card').addEventListener('touchstart', event => {
      touch = event.touches.length === 1 ? { x: event.touches[0].clientX, y: event.touches[0].clientY } : null;
    }, { passive: true });
    $('card').addEventListener('touchend', event => {
      if (!touch || !event.changedTouches.length) return;
      const dx = event.changedTouches[0].clientX - touch.x;
      const dy = event.changedTouches[0].clientY - touch.y;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1);
      touch = null;
    }, { passive: true });
    $('card').addEventListener('touchcancel', () => { touch = null; });
    translate();
    load();
  })();
  </script>
</body>
</html>
